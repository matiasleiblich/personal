<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero — Matias Leiblich</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --surface2:  #21262d;
    --border:    #30363d;
    --green:     #2D6A4F;
    --green-mid: #40916C;
    --green-lt:  #74C69D;
    --green-glow:#52B788;
    --teal:      #1a7f64;
    --text:      #e6edf3;
    --muted:     #7d8590;
    --accent:    #3fb68a;
    --danger:    #f85149;
    --warning:   #d29922;
    --blue:      #388bfd;
    --font:      'Inter', sans-serif;
    --mono:      'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    padding: 0;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--green), var(--green-lt));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; color: white; letter-spacing: -0.5px;
  }
  .header-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
  }
  .pill.live { color: var(--accent); border-color: var(--accent); }
  .pill.live::before { content: '● '; }
  #last-update { font-size: 11px; color: var(--muted); }

  /* LAYOUT */
  .main { padding: 24px 32px; max-width: 1600px; margin: 0 auto; }

  /* FILTROS */
  .filters {
    display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;
    align-items: center;
  }
  .filter-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  select, .btn-filter {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-family: var(--font);
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }
  select:hover, .btn-filter:hover { border-color: var(--accent); }
  .btn-filter.active {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }

  /* KPI GRID */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
  }
  .kpi:hover { border-color: var(--accent); transform: translateY(-1px); }
  .kpi.highlight {
    border-color: var(--green-mid);
    background: linear-gradient(135deg, var(--surface) 60%, rgba(45,106,79,0.15));
  }
  .kpi.highlight::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--green), var(--green-lt));
  }
  .kpi-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .kpi-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    font-family: var(--mono);
  }
  .kpi-value.green { color: var(--green-glow); }
  .kpi-value.blue { color: var(--blue); }
  .kpi-value.warning { color: var(--warning); }
  .kpi-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .kpi-badge {
    display: inline-block;
    background: rgba(63,182,138,0.15);
    color: var(--accent);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 10px;
    font-weight: 600;
    margin-top: 4px;
  }

  /* PROGRESS BAR — dashboard $80k */
  .progress-wrap { margin-top: 10px; }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--green-lt));
    border-radius: 3px;
    transition: width 1s ease;
  }
  .progress-labels {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--muted); margin-top: 3px;
  }

  /* CHARTS GRID */
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }
  .charts-grid.two { grid-template-columns: 2fr 1fr; }
  @media (max-width: 1100px) { .charts-grid, .charts-grid.two { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 700px) { .charts-grid, .charts-grid.two { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;

    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title span.dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); display: inline-block;
  }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);

  td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(48,54,61,0.5);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;

  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    font-family: var(--font);

  .badge.tasado { background: rgba(125,133,144,0.15); color: var(--muted); }

  /* LOADING */
  .loading {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 60vh; gap: 16px;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;

    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.6px; margin-bottom: 12px;

    border: 1px solid rgba(248,81,73,0.3);
    border-radius: 8px;
    padding: 16px 20px;
    color: var(--danger);
    font-size: 13px;
    margin-bottom: 20px;
  }
</style>
</head>

// ─── FETCH DATA ───────────────────────────────────────────────────────────────
async function fetchData() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('No se pudo acceder al CSV publicado.');
    const text = await res.text();
    return parseCSV(text);
  } catch(e) {
    console.warn('Usando datos de demo:', e.message);
    return getDemoData();
  }
}

function parseCSV(text) {
  const lines = text.split('\n');
  return lines.map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    cols.push(cur.trim());
    return cols;
  });
}

// ─── PARSE ROWS ───────────────────────────────────────────────────────────────
function parseRows(rows) {
  // Saltar fila de leyenda (fila 3 = index 0 en el range desde A3)
  return rows.slice(1).map(r => ({
    nombre:       r[1]  || '',
    direccion:    r[4]  || '',
    barrio:       r[5]  || '',
    zona:         r[6]  || '',
    tipo:         r[7]  || '',
    prosp1:       r[9]  || '',
    prosp2:       r[10] || '',
    referidor:    r[11] || '',
    prospectador: r[12] || '',
    f_contacto:   r[13] || '',
    f_visita:     r[14] || '',
    f_tasacion:   r[15] || '',
    estado:       r[16] || '',
    val_prueba1:  parseNum(r[17]),
    val_pub_ini:  parseNum(r[21]),
    val_pub_ult:  parseNum(r[22]),
    captador:     r[23] || '',
    f_reserva:    r[24] || '',
    precio_cierre:parseNum(r[25]),
    vendedor:     r[27] || '',
    f_escritura:  r[28] || '',
    dias_venta:   parseNum(r[29]),
    pct_neg:      parseNum(r[30]),
    total_bruto:  parseNum(r[39]),
    tbol_total:   parseNum(r[53]),
    dashboard:    parseNum(r[55]),
    fee:          parseNum(r[54]),
  })).filter(r => r.nombre || r.direccion);
}

function parseNum(v) {
  if (!v && v !== 0) return null;
  const n = parseFloat(String(v).replace(/[^\d.-]/g,''));
  return isNaN(n) ? null : n;
}

function fmt(n, dec=0) {
  if (n === null || n === undefined) return '—';
  return n.toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtUSD(n) {
  if (!n) return '—';
  return 'USD ' + fmt(n);
}

// ─── COMPUTE KPIs ─────────────────────────────────────────────────────────────
function compute(rows, filtroAño) {
  const hoy = new Date();
  const año = filtroAño === 'todo' ? null : parseInt(filtroAño);

  function inAño(fecha) {
    if (!fecha) return true;
    const d = parseDate(fecha);
    if (!d) return true;
    return año ? d.getFullYear() === año : true;
  }

  function parseDate(s) {
    if (!s) return null;
    const p = String(s).split('/');
    if (p.length === 3) return new Date(p[2], p[1]-1, p[0]);
    return new Date(s);
  }

  const vendidos = rows.filter(r => {
    const esVendido = ['Vendido','Busqueda GANADA','Reservado'].includes(r.estado);
    return esVendido && (año ? inAño(r.f_escritura) : true);
  });

  const enVenta = rows.filter(r => r.estado === 'En Venta');
  const captados = rows.filter(r => ['En Venta','Vendido','Reservado','Busqueda GANADA'].includes(r.estado));
  const tasados  = rows.filter(r => r.estado && r.estado !== '' && r.estado !== 'Sin Visita');
  const conFecha = rows.filter(r => r.f_contacto);

  const comisionBruta = vendidos.reduce((s,r) => s + (r.total_bruto||0), 0);
  const bolsillo      = vendidos.reduce((s,r) => s + (r.tbol_total||0), 0);
  const dashboard     = rows.reduce((s,r) => s + (r.dashboard||0), 0);
  const dashAño       = rows.filter(r => inAño(r.f_escritura)).reduce((s,r) => s + (r.dashboard||0), 0);
  const fees          = rows.reduce((s,r) => s + (r.fee||0), 0);

  const ticketProm = vendidos.length
    ? vendidos.reduce((s,r) => s + (r.precio_cierre||0), 0) / vendidos.length
    : 0;

  const diasProm = vendidos.filter(r => r.dias_venta).length
    ? vendidos.filter(r => r.dias_venta).reduce((s,r) => s + r.dias_venta, 0) /
      vendidos.filter(r => r.dias_venta).length
    : 0;

  const pctCaptacion = tasados.length ? (captados.length / tasados.length * 100) : 0;
  const pctVenta     = captados.length ? (vendidos.length / captados.length * 100) : 0;
  const pctConversion= tasados.length ? (vendidos.length / tasados.length * 100) : 0;

  const maxComision = vendidos.length
    ? Math.max(...vendidos.map(r => r.total_bruto||0))
    : 0;
  const minComision = vendidos.filter(r => r.total_bruto).length
    ? Math.min(...vendidos.filter(r => r.total_bruto).map(r => r.total_bruto))
    : 0;

  // Valor en cartera activa
  const valorCartera = enVenta.reduce((s,r) => {
    const v = r.val_pub_ult || r.val_pub_ini || 0;
    return s + v;
  }, 0);
  const comisionPotencial = valorCartera * 0.06; // 3%+3% promedio

  // Por origen
  const origenes = {};
  rows.forEach(r => {
    const o = r.prosp2 || r.prosp1 || 'Sin dato';
    origenes[o] = (origenes[o]||0) + 1;
  });

  // Por zona
  const zonas = {};
  rows.forEach(r => {
    const z = r.zona || 'Sin zona';
    zonas[z] = (zonas[z]||0) + 1;
  });

  // Por mes (contactos)
  const porMes = {};
  rows.forEach(r => {
    if (!r.f_contacto) return;
    const d = parseDate(r.f_contacto);
    if (!d) return;
    if (año && d.getFullYear() !== año) return;
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    porMes[k] = (porMes[k]||0) + 1;
  });

  // Tasaciones vs captaciones por mes
  const captPorMes = {};
  captados.forEach(r => {
    if (!r.f_tasacion) return;
    const d = parseDate(r.f_tasacion);
    if (!d) return;
    if (año && d.getFullYear() !== año) return;
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    captPorMes[k] = (captPorMes[k]||0) + 1;
  });

  // Top propiedades
  const top = [...vendidos].sort((a,b) => (b.tbol_total||0)-(a.tbol_total||0)).slice(0,8);

  return {
    total: rows.length,
    vendidos: vendidos.length,
    enVenta: enVenta.length,
    captados: captados.length,
    tasados: tasados.length,
    comisionBruta,
    bolsillo,
    dashboard,
    dashAño,
    fees,
    ticketProm,
    diasProm,
    pctCaptacion,
    pctVenta,
    pctConversion,
    maxComision,
    minComision,
    valorCartera,
    comisionPotencial,
    origenes,
    zonas,
    porMes,
    captPorMes,
    top,
    vendidosData: vendidos,
    enVentaData: enVenta,
  };
}

function buildCharts(kpis) {
  const defs = {
    responsive: true,
    maintainAspectRatio: true,
    plugins: { legend: { labels: { boxWidth: 10, font: { size: 11 } } } },
  };

  // Contactos por mes
  const meses = Object.keys(kpis.porMes).sort();
  new Chart(document.getElementById('chart-mes'), {
    type: 'bar',
    data: {
      labels: meses.map(m => { const [y,mo] = m.split('-'); return ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][parseInt(mo)]+' '+y.slice(2); }),
      datasets: [{
        label: 'Contactos',
        data: meses.map(m => kpis.porMes[m]),
        backgroundColor: PALETTE.green[2],
        borderRadius: 4,
      }]
    },
    options: { ...defs, plugins: { ...defs.plugins, legend: { display: false } },
      scales: { x: { grid: { display: false } }, y: { grid: { color: '#21262d' }, ticks: { precision: 0 } } }
    }
  });

  // Origen
  const origKeys = Object.keys(kpis.origenes).filter(k => kpis.origenes[k] > 0);
  new Chart(document.getElementById('chart-origen'), {
    type: 'doughnut',
    data: {
      labels: origKeys,
      datasets: [{ data: origKeys.map(k => kpis.origenes[k]),
        backgroundColor: [...PALETTE.green, ...PALETTE.orange],
        borderWidth: 0, hoverOffset: 6 }]
    },
    options: { ...defs, cutout: '65%' }
  });

  // Zona
  const zonaKeys = Object.keys(kpis.zonas).filter(k => kpis.zonas[k] > 0);
  new Chart(document.getElementById('chart-zona'), {
    type: 'doughnut',
    data: {
      labels: zonaKeys,
      datasets: [{ data: zonaKeys.map(k => kpis.zonas[k]),
        backgroundColor: [...PALETTE.blue, ...PALETTE.orange, PALETTE.green[3]],
        borderWidth: 0, hoverOffset: 6 }]
    },
    options: { ...defs, cutout: '65%' }
  });

  // Top operaciones
  const topLabels = kpis.top.map(r => (r.nombre || r.direccion).slice(0,20));
  new Chart(document.getElementById('chart-top'), {
    type: 'bar',
    data: {
      labels: topLabels,
      datasets: [{
        label: 'Tu bolsillo (USD)',
        data: kpis.top.map(r => r.tbol_total || 0),
        backgroundColor: PALETTE.green.slice(0,8),
        borderRadius: 4,
      }]
    },
    options: { ...defs,
      indexAxis: 'y',
      plugins: { ...defs.plugins, legend: { display: false } },
      scales: { x: { grid: { color: '#21262d' } }, y: { grid: { display: false } } }
    }
  });

  // Estado de cartera
  const estadoMap = {};
  // (ya calculamos vendidos, enVenta, etc)
  estadoMap['Vendido'] = kpis.vendidos;
  estadoMap['En Venta'] = kpis.enVenta;
  const otrasCant = kpis.total - kpis.vendidos - kpis.enVenta;
  if (otrasCant > 0) estadoMap['Otros'] = otrasCant;

  new Chart(document.getElementById('chart-estado'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(estadoMap),
      datasets: [{ data: Object.values(estadoMap),
        backgroundColor: [PALETTE.green[2], PALETTE.blue[0], PALETTE.muted],
        borderWidth: 0, hoverOffset: 6 }]
    },
    options: { ...defs, cutout: '60%' }
  });
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
let allRows = [];
let filtroAño = '2026';

async function init() {
  const raw = await fetchData();
  allRows = parseRows(raw);
  renderFiltrado();
}

function renderFiltrado() {
  const kpis = compute(allRows, filtroAño);
  render(allRows, kpis, filtroAño);
}

function cambiarFiltro() {
  filtroAño = document.getElementById('filtro-año').value;
  // destruir charts existentes
  Chart.helpers.each(Chart.instances, c => c.destroy());
  renderFiltrado();
}

init();

// Auto-refresh cada 5 minutos
setInterval(init, 5 * 60 * 1000);
</script>
